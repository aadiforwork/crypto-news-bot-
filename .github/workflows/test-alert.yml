name: Test Alert

# Manual-only: checks which notification channels are actually working.
# Actions tab -> Test Alert -> Run workflow -> job log me per-channel result dikhega.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WHATSAPP_CLOUD_TOKEN: ${{ secrets.WHATSAPP_CLOUD_TOKEN }}
          WHATSAPP_CLOUD_PHONE_ID: ${{ secrets.WHATSAPP_CLOUD_PHONE_ID }}
          WHATSAPP_TWILIO_SID: ${{ secrets.WHATSAPP_TWILIO_SID }}
          WHATSAPP_TWILIO_TOKEN: ${{ secrets.WHATSAPP_TWILIO_TOKEN }}
          WHATSAPP_TWILIO_FROM: ${{ secrets.WHATSAPP_TWILIO_FROM }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py --test-alert
