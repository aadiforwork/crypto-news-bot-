name: Crypto News Bot

on:
  schedule:
    # Every 15 minutes (free tier safe: ~700 min/month of 2000 free)
    - cron: "*/15 * * * *"
  workflow_dispatch:  # Manual run button

concurrency:
  group: crypto-news-bot
  cancel-in-progress: true

permissions:
  contents: write  # Needed to save processed.json back to repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets (fail LOUD if missing - no silent green runs)
        run: |
          missing=0
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || { echo "::error::MISSING SECRET: TELEGRAM_BOT_TOKEN"; missing=1; }
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] || { echo "::error::MISSING SECRET: TELEGRAM_CHAT_ID"; missing=1; }
          [ -n "${{ secrets.GROQ_API_KEY }}" ] || { echo "::error::MISSING SECRET: GROQ_API_KEY"; missing=1; }
          [ "$missing" = "1" ] && { echo "Add secrets at: repo Settings > Secrets and variables > Actions"; exit 1; }
          echo "All required secrets present."

      - name: Run bot (one cycle)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WHATSAPP_CLOUD_TOKEN: ${{ secrets.WHATSAPP_CLOUD_TOKEN }}
          WHATSAPP_CLOUD_PHONE_ID: ${{ secrets.WHATSAPP_CLOUD_PHONE_ID }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py --once

      - name: Save processed state (no resends next run)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add processed.json || true
          git diff --staged --quiet || git commit -m "Update processed state [skip ci]"
          git push || echo "Nothing to push"
